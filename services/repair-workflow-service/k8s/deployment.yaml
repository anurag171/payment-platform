apiVersion: apps/v1
kind: Deployment
metadata:
  name: repair-workflow-service
  labels:
    app: repair-workflow-service
    tier: workflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: repair-workflow-service
  template:
    metadata:
      labels:
        app: repair-workflow-service
        tier: workflow
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
    spec:
      containers:
      - name: repair-workflow-service
        # Plain placeholder image name+tag — overridden per-environment via the root
        # kustomization.yaml's `images:` transformer (kustomize edit set image ...),
        # not Helm. Do not hand-edit this line per environment; edit the kustomization.
        image: "repair-workflow-service:latest"
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: TEMPORAL_TARGET
          valueFrom:
            configMapKeyRef: {name: payment-platform-config, key: temporal-target}
        - name: TEMPORAL_NAMESPACE
          valueFrom:
            configMapKeyRef: {name: payment-platform-config, key: temporal-namespace}
        resources:
          requests:
            cpu: "150m"
            memory: "192Mi"
          limits:
            cpu: "300m"
            memory: "384Mi"
        readinessProbe:
          httpGet: {path: /actuator/health/readiness, port: 8080}
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet: {path: /actuator/health/liveness, port: 8080}
          initialDelaySeconds: 30
          periodSeconds: 15
        startupProbe:
          httpGet: {path: /actuator/health, port: 8080}
          failureThreshold: 30
          periodSeconds: 5
